<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RSVP — Aaron &amp; Brooke</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- ══════════════════════════════════════════
       NAV
  ══════════════════════════════════════════ -->
  <nav>
    <a href="index.html" class="nav-monogram">A &amp; B</a>
    <ul class="nav-links">
      <li class="nav-dropdown">
        <a href="index.html" class="nav-dropdown-toggle">Home ▾</a>
        <ul class="dropdown-menu">
          <li><a href="index.html#about">About the Couple</a></li>
          <li><a href="index.html#venue">Venue</a></li>
          <li><a href="index.html#registry">Wedding Registry</a></li>
          <li><a href="index.html#countdown">Countdown</a></li>
        </ul>
      </li>
      <li><a href="rsvp.html" class="nav-rsvp">RSVP INFO</a></li>
    </ul>
  </nav>

  <!-- ══════════════════════════════════════════
       RSVP CONTENT
  ══════════════════════════════════════════ -->
  <div class="rsvp-page-wrap">
    <section class="rsvp-section">
      <span class="section-label">We Can't Wait to Celebrate</span>
      <h1 class="section-title">RSVP Information</h1>
      <div class="divider"><span class="divider-icon">✦</span></div>
      <div class="placeholder-section">
        Coming soon!
      </div>
    </section>
  </div>

  <script>
    // Dropdown — tap to open/close on mobile, hover still works on desktop
    const dropdown = document.querySelector('.nav-dropdown');
    const toggle   = document.querySelector('.nav-dropdown-toggle');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    document.querySelectorAll('.dropdown-menu a').forEach(link => {
      link.addEventListener('click', () => dropdown.classList.remove('open'));
    });
  </script>

</body>
</html>
